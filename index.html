   if (activeView === 'testing') renderViewport();\n    showToast('Removed ' + host);\n  }, 'Remove');\n}\n\n// Hide: reversible, immediate, no confirmation needed. Removes the target\n// from the main Targets list and files it under the \"Hidden (N)\" list next\n// to the sorting/filter toolbar, where it can be unhidden or permanently\n// deleted later.\nfunction hideTarget(host) {\n  if (!hiddenHosts.includes(host)) hiddenHosts.push(host);\n  saveState();\n  // Hide the card directly via DOM — no re-render, preserves scroll position\n  document.querySelectorAll('.t-card').forEach(card => {\n    if (card.querySelector('[data-action=\"hide-target\"][data-value=\"' + host + '\"]')) {\n      card.style.transition = 'opacity 0.2s, transform 0.2s';\n      card.style.opacity = '0';\n      card.style.transform = 'scale(0.95)';\n      setTimeout(() => card.remove(), 200);\n    }\n  });\n  // Update hidden count badge\n  const hiddenBtn = document.getElementById('hiddenToggleBtn');\n  if (hiddenBtn) hiddenBtn.innerHTML = '<i class=\"ph ph-eye-slash\"><\/i> Hidden (' + hiddenHosts.length + ')';\n  showToast('Hidden ' + host);\n}\n\nfunction unhideTarget(host) {\n  hiddenHosts = hiddenHosts.filter(h => h !== host);\n  saveState();\n  renderViewport();\n  showToast('Unhidden ' + host);\n}\n\nfunction unhideAll() {\n  if (!hiddenHosts.length) return;\n  confirmAction('Unhide All', 'Unhide all ' + hiddenHosts.length + ' hidden target(s)?', () => {\n    hiddenHosts = [];\n    saveState();\n    renderViewport();\n    showToast('Unhidden all targets');\n  }, 'Unhide All');\n}\n\nfunction getFilteredHosts() {\n  let search = (document.getElementById('searchInput')?.value || '').toLowerCase();\n  let prio = document.getElementById('prioFilter')?.value || 'all';\n  let statusF = document.getElementById('statusFilter')?.value || 'all';\n  let cat = currentCategory || 'all';\n  let filtered = showHiddenOnly\n    ? T.filter(t => hiddenHosts.includes(t.host))\n    : T.filter(t => !hiddenHosts.includes(t.host));\n  filtered = filtered.filter(t => {\n    if (prio !== 'all' && t.priority !== prio) return false;\n    if (cat !== 'all' && !(t.cats || []).includes(cat)) return false;\n    if (search) {\n      let hay = (t.host + ' ' + (t.title||'') + ' ' + (t.tech||[]).join(' ') + ' ' + (t.ip||'')).toLowerCase();\n      if (!hay.includes(search)) return false;\n    }\n    if (statusF !== 'all') {\n      if (statusF === '2xx' && (t.status < 200 || t.status >= 300)) return false;\n      else if (statusF === '3xx' && (t.status < 300 || t.status >= 400)) return false;\n      else if (statusF === '4xx' && (t.status < 400 || t.status >= 500)) return false;\n      else if (statusF === '5xx' && t.status < 500) return false;\n      else if (['200','301','401','403','500'].includes(statusF) && t.status !== parseInt(statusF)) return false;\n    }\n    return true;\n  });\n  return filtered.map(t => t.host);\n}\n\nfunction copyFilteredTargets() {\n  const hosts = getFilteredHosts();\n  if (!hosts.length) { showToast('No targets to copy'); return; }\n  navigator.clipboard.writeText(hosts.join('\\n')).then(() => showToast('Copied ' + hosts.length + ' host(s)')).catch(() => showToast('Copy failed'));\n}\n\nfunction hideFilteredTargets() {\n  const hosts = getFilteredHosts();\n  if (!hosts.length) { showToast('No targets to hide'); return; }\n  hosts.forEach(h => { if (!hiddenHosts.includes(h)) hiddenHosts.push(h); });\n  saveState();\n  renderViewport();\n  showToast('Hidden ' + hosts.length + ' target(s)');\n}\n\n// Delete: permanent. Actually removes the target and all of its associated\n// data (notes, testing state, pre-testing answers, editor tabs, etc.) — it\n// will not come back on reload/resume. (Bug fix: this used to just alias\n// Hide, leaving the target in memory and state forever with no way to\n// truly get rid of it.)\nfunction confirmDeleteTarget(host) {\n  confirmAction('Delete Target', 'Permanently delete ' + host + '? This cannot be undone — the target and all of its notes and testing data will be removed.', () => {\n    permanentlyDeleteTarget(host);\n  }, 'Delete Forever');\n}\n\nfunction permanentlyDeleteTarget(host) {\n  const wasOpenInEditor = openEditorTabs.includes(host);\n  T = T.filter(t => t.host !== host);\n  delete M[host];\n  purgedHosts = purgedHosts.filter(h => h !== host);\n  purgedHosts.push(host);\n  hiddenHosts = hiddenHosts.filter(h => h !== host);\n  testingHosts = testingHosts.filter(h => h !== host);\n  if (selectedTestingHost === host) selectedTestingHost = testingHosts[0] || null;\n  delete notes[host];\n  delete activeNote[host];\n  delete openFolders[host];\n  delete checklistState[host];\n  delete customSteps[host];\n  delete hiddenSteps[host];\n  delete pretestingAnswers[host];\n  delete ptOpenSections[host];\n  delete openQuestions[host];\n  delete sidebarWidths[host];\n  delete sidebarCollapsed[host];\n  delete sidebarActiveTab[host];\n  if (cmInstances[host]) { try { cmInstances[host].toTextArea(); } catch(e) {} delete cmInstances[host]; }\n  saveState();\n  if (wasOpenInEditor) {\n    closeEditorTab(host);\n  } else {\n    renderViewport();\n  }\n  showToast('Permanently deleted ' + host);\n}\n\n// ========== MODALS ==========\nfunction openAddModal() {\n  document.getElementById('addModal').classList.add('open');\n  setTimeout(() => document.getElementById('newHost').focus(), 100);\n}\nfunction closeModal(id) { document.getElementById(id).classList.remove('open'); }\nfunction addCustomSubdomain() {\n  let host = document.getElementById('newHost').value.trim();\n  if (!host) return;\n  let url = document.getElementById('newUrl').value.trim() || 'https://' + host;\n  if (!M[host]) {\n    let nt = { host, url, ip:'-', port:'-', status:0, tech:[], title:'', words:0, cl:0, score:0, priority:'info', cats:['web'], vulns:[], steps: generatePretestingSteps(host, [], 0), desc:'Custom target', ips:[], score_breakdown:{} };\n    T.push(nt); M[nt.host] = nt;\n  }\n  addToTesting(host);\n  closeModal('addModal');\n  document.getElementById('newHost').value = '';\n  document.getElementById('newUrl').value = '';\n}\n\nlet confirmCallback = null;\nfunction confirmAction(title, msg, callback, btnLabel) {\n  document.getElementById('confirmTitle').innerText = title;\n  document.getElementById('confirmMsg').innerText = msg;\n  document.getElementById('confirmBtn').innerText = btnLabel || 'Delete';\n  confirmCallback = callback;\n  document.getElementById('confirmModal').classList.add('open');\n}\ndocument.getElementById('confirmBtn').addEventListener('click', () => {\n  closeModal('confirmModal');\n  if (confirmCallback) { confirmCallback(); confirmCallback = null; }\n});\n\n// ========== PERSISTENT <domain>.json (File System Access API + IndexedDB) ==========\n// Goal: every change in the dashboard silently overwrites a single \"<domain>.json\"\n// file living next to this HTML file — no repeated download dialogs, no growing\n// pile of \"target (1).json\" copies. This uses the File System Access API, which\n// is supported in Chrome/Edge/Opera. On unsupported browsers (Firefox/Safari) we\n// fall back to a manual \"download <domain>.json\" action, since those browsers have\n// no API for a page to silently overwrite a local file.\nconst FS_DB_NAME = 'keendash-fs';\nconst FS_STORE = 'handles';\nconst FS_KEY = 'target-json-handle';\nconst fsSupported = ('showSaveFilePicker' in window);\nlet fileHandle = null;\nlet pendingHandle = null;\nlet autosaveTimer = null;\n\n// Compute base domain from first target\nfunction getBaseDomain() {\n  if (T.length === 0) return 'target';\n  let host = T[0].host;\n  let parts = host.split('.');\n  if (parts.length >= 1) {\n    return parts[0];\n  }\n  return host;\n}\n\nfunction openHandleDB() {\n  return new Promise((resolve, reject) => {\n    const req = indexedDB.open(FS_DB_NAME, 1);\n    req.onupgradeneeded = () => { req.result.createObjectStore(FS_STORE); };\n    req.onsuccess = () => resolve(req.result);\n    req.onerror = () => reject(req.error);\n  });\n}\nasync function idbGet(key) {\n  try {\n    const db = await openHandleDB();\n    return await new Promise((resolve, reject) => {\n      const tx = db.transaction(FS_STORE, 'readonly');\n      const r = tx.objectStore(FS_STORE).get(key);\n      r.onsuccess = () => resolve(r.result || null);\n      r.onerror = () => reject(r.error);\n    });\n  } catch(e) { return null; }\n}\nasync function idbSet(key, value) {\n  try {\n    const db = await openHandleDB();\n    return await new Promise((resolve, reject) => {\n      const tx = db.transaction(FS_STORE, 'readwrite');\n      tx.objectStore(FS_STORE).put(value, key);\n      tx.oncomplete = () => resolve(true);\n      tx.onerror = () => reject(tx.error);\n    });\n  } catch(e) { return false; }\n}\n\nfunction updateSaveIndicator(status, label) {\n  const dot = document.querySelector('#save-status .status-dot');\n  const txt = document.getElementById('save-status-label');\n  const btnLabel = document.getElementById('save-btn-label');\n  if (dot) dot.className = 'status-dot ' + status;\n  if (txt) txt.textContent = label;\n  if (btnLabel) btnLabel.textContent = fileHandle ? 'Save now' : 'Link ' + getBaseDomain() + '.json';\n}\n\nasync function tryRestoreFileHandle() {\n  if (!fsSupported) { updateSaveIndicator('gray', 'Autosave needs Chrome/Edge'); return; }\n  const stored = await idbGet(FS_KEY);\n  if (!stored) { updateSaveIndicator('gray', 'Not linked — click Save'); return; }\n  try {\n    const perm = await stored.queryPermission({ mode: 'readwrite' });\n    if (perm === 'granted') {\n      fileHandle = stored;\n      updateSaveIndicator('green', 'Autosaving to ' + getBaseDomain() + '.json');\n    } else {\n      pendingHandle = stored;\n      updateSaveIndicator('yellow', 'Click Save to relink ' + getBaseDomain() + '.json');\n    }\n  } catch(e) {\n    updateSaveIndicator('gray', 'Not linked — click Save');\n  }\n}\n\nasync function connectFileHandle() {\n  if (!fsSupported) return false;\n  try {\n    if (pendingHandle) {\n      const perm = await pendingHandle.requestPermission({ mode: 'readwrite' });\n      if (perm === 'granted') { fileHandle = pendingHandle; pendingHandle = null; return true; }\n      return false;\n    }\n    const handle = await window.showSaveFilePicker({\n      suggestedName: getBaseDomain() + '.json',\n      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]\n    });\n    await idbSet(FS_KEY, handle);\n    fileHandle = handle;\n    return true;\n  } catch(e) {\n    return false; // user cancelled the picker — not an error\n  }\n}\n\nasync function writeStateToDisk(jsonString) {\n  if (!fileHandle) return false;\n  try {\n    const writable = await fileHandle.createWritable();\n    await writable.write(jsonString);\n    await writable.close();\n    return true;\n  } catch(e) {\n    console.error('KeenDash: failed writing ' + getBaseDomain() + '.json', e);\n    fileHandle = null;\n    return false;\n  }\n}\n\nfunction buildExportData() {\n  // Collect live content from all CodeMirror instances first\n  for (let h in cmInstances) {\n    try {\n      let note = getCurrentNote(h);\n      if (note) note.content = cmInstances[h].getValue();\n    } catch(e) {}\n  }\n  return {\n    KeenDash_state: true,\n    version: '9.2',\n    exportedAt: new Date().toISOString(),\n    targets: T,\n    state: {\n      hidden: hiddenHosts,\n      purged: purgedHosts,\n      testing: testingHosts,\n      notes: notes,\n      activeNote: activeNote,\n      openFolders: openFolders,\n      checklist: checklistState,\n      customSteps: customSteps,\n      hiddenSteps: hiddenSteps,\n      pretestingAnswers: pretestingAnswers,\n      ptOpenSections: ptOpenSections,\n      openQuestions: openQuestions,\n      sidebarWidths: sidebarWidths,\n      sidebarCollapsed: sidebarCollapsed,\n      sidebarActiveTab: sidebarActiveTab,\n      testingSidebarCollapsed: testingSidebarCollapsed,\n      generalNotesContent: generalNotesContent,\n      custom: T.filter(t => t.desc === 'Custom target').map(t => ({host: t.host, url: t.url}))\n    }\n  };\n}\n\nfunction downloadFallback(jsonString) {\n  const blob = new Blob([jsonString], {type: 'application/json'});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url;\n  a.download = getBaseDomain() + '.json';\n  document.body.appendChild(a);\n  a.click();\n  document.body.removeChild(a);\n  URL.revokeObjectURL(url);\n}\n\n// isAuto=true  -> silent background autosave (only writes if already linked)\n// isAuto=false -> user clicked Save: link the file if needed, then write\nasync function saveTargetJSON(isAuto) {\n  const exportData = buildExportData();\n  const json = JSON.stringify(exportData, null, 2);\n\n  if (fileHandle) {\n    const ok = await writeStateToDisk(json);\n    if (ok) {\n      updateSaveIndicator('green', 'Saved ' + new Date().toLocaleTimeString());\n      if (!isAuto) showToast('Saved to ' + getBaseDomain() + '.json');\n      return;\n    }\n  }\n\n  if (isAuto) {\n    updateSaveIndicator(fsSupported ? 'yellow' : 'gray', 'Unsaved changes — click Save');\n    return;\n  }\n\n  // Manual save with no active handle: try to link one now\n  if (fsSupported) {\n    const connected = await connectFileHandle();\n    if (connected) {\n      const ok = await writeStateToDisk(json);\n      updateSaveIndicator(ok ? 'green' : 'yellow', ok ? 'Saved ' + new Date().toLocaleTimeString() : 'Save failed');\n      showToast(ok ? 'Linked & saved ' + getBaseDomain() + '.json' : 'Could not save target.json');\n      return;\n    }\n  }\n\n  // Fallback for browsers without the File System Access API (or a cancelled picker)\n  downloadFallback(json);\n  updateSaveIndicator('yellow', 'Downloaded ' + getBaseDomain() + '.json (manual)');\n  showToast('Downloaded ' + getBaseDomain() + '.json — this browser can\\'t autosave silently');\n}\n\nfunction handleSaveClick() { saveTargetJSON(false); }\n\nfunction queueAutosave() {\n  clearTimeout(autosaveTimer);\n  if (fileHandle) updateSaveIndicator('yellow', 'Saving…');\n  autosaveTimer = setTimeout(() => { saveTargetJSON(true); }, 700);\n}\n\n// ========== UTILITIES ==========\nfunction hashCode(str) {\n  let hash = 0;\n  for (let i = 0; i < str.length; i++) {\n    const ch = str.charCodeAt(i);\n    hash = ((hash << 5) - hash) + ch;\n    hash |= 0;\n  }\n  return 'h' + Math.abs(hash).toString(36);\n}\nfunction openInNewTab(url) { window.open(url, '_blank'); }\n\nfunction copyClip(txt) {\n  navigator.clipboard.writeText(txt).then(() => showToast('Copied: ' + txt)).catch(() => showToast('Copy failed'));\n}\n\nfunction showToast(msg) {\n  const t = document.getElementById('toast');\n  t.innerHTML = '<i class=\"ph ph-check-circle\" style=\"color:var(--success)\"><\/i> ' + msg;\n  t.classList.add('show');\n  setTimeout(() => t.classList.remove('show'), 2500);\n}\n\nfunction escHtml(str) { return str ? String(str).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;') : ''; }\nfunction escAttr(str) {\n  if (!str) return '';\n  return String(str).replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/\"/g,'&quot;').replace(/<\/g,'&#60;').replace(/>/g,'&#62;');\n}\n\n// ========== KEYBOARD SHORTCUTS ==========\ndocument.addEventListener('keydown', e => {\n  if (e.ctrlKey && e.shiftKey && e.key === 'P') {\n    e.preventDefault();\n    if (activeView.startsWith('editor-')) {\n      let host = activeView.replace('editor-','');\n      setNoteModeByHost(host, 'preview');\n    }\n  }\n  if (e.ctrlKey && e.key === 's') {\n    e.preventDefault();\n    saveTargetJSON(false);\n  }\n  if (e.ctrlKey && e.key === '/') {\n    e.preventDefault();\n    showShortcutsModal();\n  }\n  if (e.key === 'Escape') {\n    document.querySelectorAll('.mod-bg.open').forEach(m => m.classList.remove('open'));\n    closeContextMenu();\n  }\n});\n\ndocument.querySelectorAll('.mod-bg').forEach(modal => {\n  modal.addEventListener('click', e => {\n    if (e.target === modal) modal.classList.remove('open');\n  });\n});\n\n// Close context menu on click outside\ndocument.addEventListener('click', e => {\n  if (!e.target.closest('#ctx-menu')) closeContextMenu();\n});\n\n// ===== ENHANCEMENT FUNCTIONS =====\nfunction duplicateNote(host) {\n  const note = getCurrentNote(host);\n  if (!note) return;\n  const id = addNoteItem(host, note.title + ' (copy)', note.content, 'file', note.parentId);\n  // Open parent folder if needed\n  if (note.parentId) {\n    let open = openFolders[host] || [];\n    if (!open.includes(note.parentId)) { open.push(note.parentId); openFolders[host] = open; }\n  }\n  saveState();\n  renderNotesTree(host);\n  selectNote(host, id);\n  showToast('Note duplicated');\n}\n\nfunction exportNote(host) {\n  const note = getCurrentNote(host);\n  if (!note) return;\n  const blob = new Blob([note.content], {type:'text/markdown'});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url;\n  a.download = note.title.replace(/[^a-zA-Z0-9_-]/g, '_') + '.md';\n  document.body.appendChild(a);\n  a.click();\n  document.body.removeChild(a);\n  URL.revokeObjectURL(url);\n  showToast('Exported ' + a.download);\n}\n\nfunction showShortcutsModal() {\n  const existing = document.getElementById('shortcutsModal');\n  if (existing) { existing.classList.remove('open'); return; }\n  const modal = document.createElement('div');\n  modal.id = 'shortcutsModal';\n  modal.className = 'mod-bg open';\n  modal.innerHTML = '<div class=\"mod\" style=\"width:500px\">' +\n    '<h3 style=\"margin-bottom:16px\"><i class=\"ph ph-keyboard\" style=\"margin-right:8px\"><\/i>Keyboard Shortcuts<\/h3>' +\n    '<div style=\"font-size:13px;color:var(--text-secondary);line-height:2\">' +\n    '<div style=\"display:flex;justify-content:space-between\"><span><kbd style=\"background:var(--bg-surface);padding:2px 6px;border-radius:3px;border:1px solid var(--border)\">Ctrl+S<\/kbd><\/span><span>Save / link target.json<\/span><\/div>' +\n    '<div style=\"display:flex;justify-content:space-between\"><span><kbd style=\"background:var(--bg-surface);padding:2px 6px;border-radius:3px;border:1px solid var(--border)\">Ctrl+Shift+P<\/kbd><\/span><span>Preview mode<\/span><\/div>' +\n    '<div style=\"display:flex;justify-content:space-between\"><span><kbd style=\"background:var(--bg-surface);padding:2px 6px;border-radius:3px;border:1px solid var(--border)\">Ctrl+/<\/kbd><\/span><span>Show shortcuts<\/span><\/div>' +\n    '<div style=\"display:flex;justify-content:space-between\"><span><kbd style=\"background:var(--bg-surface);padding:2px 6px;border-radius:3px;border:1px solid var(--border)\">Esc<\/kbd><\/span><span>Close modals<\/span><\/div>' +\n    '<\/div>' +\n    '<div class=\"mod-acts\" style=\"margin-top:16px\"><button class=\"btn-action\" id=\"closeShortcutsBtn\">Close<\/button><\/div>' +\n    '<\/div>';\n  modal.addEventListener('click', e => {\n    if (e.target === modal || e.target.id === 'closeShortcutsBtn') modal.classList.remove('open');\n  });\n  document.body.appendChild(modal);\n}\n\n// ========== CLICK HANDLING ==========\n// Host name click already opens in new tab via <a> tag.\n// We removed the copy-on-click listener, so the link works normally.\n// The Copy button still works via data-action=\"copy-clip\".\n\n// Event delegation for target card buttons\ndocument.addEventListener('click', function(e) {\n  const btn = e.target.closest('[data-action]');\n  if (!btn) return;\n  const action = btn.dataset.action;\n  const value = btn.dataset.value;\n  if (action === 'copy-clip') copyClip(value);\n  if (action === 'add-testing') addToTesting(value);\n  if (action === 'hide-target') hideTarget(value);\n  if (action === 'unhide-target') unhideTarget(value);\n  if (action === 'delete-target') confirmDeleteTarget(value);\n  if (action === 'select-host') selectTestingHost(value);\n  if (action === 'open-editor') openEditorTab(value);\n  if (action === 'remove-testing') removeFromTesting(value);\n  if (action === 'toggle-sidebar') toggleSidebar(value);\n  if (action === 'toggle-detail') {\n    const sd = document.getElementById('sd-'+value);\n    if (!sd) return;\n    if (sd.classList.contains('open')) {\n      sd.style.maxHeight = sd.scrollHeight + 'px';\n      requestAnimationFrame(() => {\n        sd.style.transition = 'max-height 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease, margin 0.3s ease, padding 0.3s ease, border-color 0.3s ease';\n        sd.style.maxHeight = '0px';\n        sd.style.opacity = '0';\n        sd.classList.remove('open');\n        btn.classList.remove('active');\n      });\n    } else {\n      sd.classList.add('open');\n      btn.classList.add('active');\n      sd.style.transition = 'none';\n      sd.style.maxHeight = '0px';\n      sd.style.opacity = '0';\n      requestAnimationFrame(() => {\n        sd.style.transition = 'max-height 0.4s cubic-bezier(0.4,0,0.2,1), opacity 0.35s ease, margin 0.3s ease, padding 0.3s ease, border-color 0.3s ease';\n        sd.style.maxHeight = sd.scrollHeight + 'px';\n        sd.style.opacity = '1';\n        setTimeout(() => { sd.style.maxHeight = 'none'; }, 420);\n      });\n    }\n  }\n});\n\n// ========== BOOT ==========\nloadInitialState();\nrenderNav();\nrenderViewport();\nupdateNoteCount();\ntryRestoreFileHandle();\n<\/script>\n<\/body>\n<\/html>";
  const E = KeenEngine;
  const $ = (id) => document.getElementById(id);
  const isObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
  const truthy = (v) => !(v === null || v === undefined || v === 0 || v === "" || v === false || (Array.isArray(v) && !v.length) || (isObj(v) && !Object.keys(v).length));
  const escH = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const plural = (n) => (n !== 1 ? "s" : "");

  /* ---- base64 <-> UTF-8 (python: base64.b64encode(json.dumps(...).encode("utf-8"))) ---- */
  function toB64(str) {
    const u = new TextEncoder().encode(str); let bin = "";
    for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  function fromB64(b) { const bin = atob(b.trim()); return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))); }

  function demojibake(v) {
    if (typeof v === "string") {
      for (let i = 0; i < 4 && /[\u00c2-\u00f4][\u0080-\u00bf]/.test(v); i++) {
        let bytes; try { bytes = Uint8Array.from(v, (c) => { const n = c.charCodeAt(0); if (n > 255) throw 0; return n; }); } catch (e) { return v; }
        let d; try { d = new TextDecoder("utf-8", { fatal: true }).decode(bytes); } catch (e) { return v; }
        if (d === v) return v; v = d;
      }
      return v;
    }
    if (Array.isArray(v)) return v.map(demojibake);
    if (isObj(v)) { const o = {}; for (const k of Object.keys(v)) o[k] = demojibake(v[k]); return o; }
    return v;
  }

  /* ---- load_data(): previous dashboard .html, KeenDash state .json, or raw HTTPX ---- */
  function loadData(raw, notes) {
    raw = raw.replace(/^\s+|\s+$/g, "");
    if (raw.startsWith("<!DOCTYPE html>") || raw.startsWith("<html")) {
      const ms = raw.match(/<script id="app-state" type="application\/json">([\s\S]*?)<\/script>/);
      const mt = raw.match(/<script id="initial-targets" type="application\/json">([\s\S]*?)<\/script>/);
      if (ms && mt) {
        try { const state = JSON.parse(ms[1]), targets = JSON.parse(fromB64(mt[1])); notes.push("Extracted state from existing HTML dashboard."); return { targets: demojibake(targets), state, isState: true }; }
        catch (e) { notes.push("Failed to parse embedded state: " + e.message); }
      }
    }
    let d; try { d = JSON.parse(raw); } catch (e) { d = undefined; }
    if (isObj(d) && d.KeenDash_state) {
      const targets = "targets" in d ? d.targets : [], state = "state" in d ? d.state : {};
      if (!Array.isArray(targets)) throw new Error("This KeenDash state file is damaged: \"targets\" is not a list.");
      if (!isObj(state)) throw new Error("This KeenDash state file is damaged: \"state\" is not an object.");
      notes.push("Detected KeenDash state export. Restoring...");
      return { targets: demojibake(targets), state, isState: true };
    }
    const { entries, report } = E.parseRecords(raw);
    notes.push(`HTTPX (${report.format}): ${report.imported} of ${report.total} records imported` + (report.skipped.length ? `, ${report.skipped.length} skipped` : ""));
    report.skipped.slice(0, 10).forEach((k) => notes.push(`  skipped ${k.where}: ${k.reason}`));
    if (report.skipped.length > 10) notes.push(`  ... and ${report.skipped.length - 10} more skipped`);
    if (!entries.length) return { targets: [], state: {}, isState: false };
    return { targets: E.buildTargets(entries), state: {}, isState: false };
  }

  /* ---- main(): purge, enrich, ip map, state normalisation ---- */
  function prepare(mainText, katanaText, nucleiText) {
    const notes = [];
    let { targets, state, isState } = loadData(mainText, notes);
    if (!targets.length) throw new Error("No data found. Expected HTTPX JSON/JSONL or a KeenDash state file.");
    if (isState && truthy(state)) {
      const purged = new Set(state.purged || []);
      if (purged.size) {
        const before = targets.length; targets = targets.filter((t) => !purged.has(t.host));
        if (before - targets.length) notes.push(`Dropped ${before - targets.length} permanently-deleted host(s) from resumed data`);
      }
    }
    let kmap = {}, nmap = {};
    if (katanaText) {
      const p = E.parseKatana(katanaText); kmap = p.map;
      notes.push(`Katana: ${Object.values(kmap).reduce((a, v) => a + v.urls.size, 0)} URLs across ${Object.keys(kmap).length} hosts` + (p.report.skipped.length ? ` (${p.report.skipped.length} records skipped)` : ""));
    }
    if (nucleiText) {
      const p = E.parseNuclei(nucleiText); nmap = p.map;
      notes.push(`Nuclei: ${Object.values(nmap).reduce((a, v) => a + v.length, 0)} findings across ${Object.keys(nmap).length} hosts` + (p.report.skipped.length ? ` (${p.report.skipped.length} records skipped)` : ""));
    }
    if (Object.keys(kmap).length || Object.keys(nmap).length) {
      targets = E.enrichWithRecon(targets, kmap, nmap);
      targets.sort((a, b) => b.score - a.score);
      notes.push("Recon data merged - scores and vulnerabilities updated");
    }
    const ipMap = E.buildIpMap(targets);
    notes.push(`Built ${targets.length} unique targets, ${ipMap.length} IPs`);
    // state normalisation exactly as main(); generate_html receives `saved_state or {}`
    let st = {};
    if (truthy(state)) {
      st = state;
      if ("deleted" in st && !("hidden" in st)) { st.hidden = st.deleted; delete st.deleted; } else delete st.deleted;
      const lists = ["hidden", "purged", "testing"], bools = ["testingSidebarCollapsed"];
      for (const k of ["hidden", "purged", "testing", "notes", "activeNote", "openFolders", "checklist", "customSteps", "hiddenSteps", "pretestingAnswers", "ptOpenSections", "openQuestions", "sidebarWidths", "sidebarCollapsed", "sidebarActiveTab", "testingSidebarCollapsed"])
        if (!(k in st)) st[k] = lists.includes(k) ? [] : bools.includes(k) ? false : {};
    }
    return { targets, ipMap, state: st, notes };
  }

  // vuln/IP rows land inside `...` template literals in the dashboard script
  const inTemplateLiteral = (h) => h.replace(/\\/g, "\\\\").replace(/`/g, "\\`").replace(/\$\{/g, "\\${");

  /* ---- generate_html(): the 7 values Python injected ---- */
  function generateHtml(targets, ipMap, state, inputName) {
    const cats = new Map(), allVulns = new Map(), vulnTargets = new Map();
    for (const t of targets) {
      for (const c of t.cats || []) cats.set(c, (cats.get(c) || 0) + 1);
      for (const v of t.vulns || []) { allVulns.set(v, (allVulns.get(v) || 0) + 1); (vulnTargets.get(v) || vulnTargets.set(v, []).get(v)).push(t.host); }
    }
    const outBase = inputName.replace(/(_state)?\.(json|html)$/i, "");
    const catOrder = ["web", "vpn", "api", "cms", "email", "cloud", "cicd", "monitoring", "admin", "auth", "database"];
    const catLabel = { web: "Web", vpn: "VPN", api: "API", cms: "CMS", email: "Email", cloud: "Cloud", cicd: "CI/CD", monitoring: "Monitor", admin: "Admin", auth: "Auth", database: "DB" };
    let catButtons = "";
    for (const c of catOrder) if (cats.get(c)) catButtons += `<button class="cat-btn" data-cat="${c}" onclick="filterByCategory(\`${c}\`, this)">${catLabel[c] || c} (${cats.get(c)})</button>`;
    let vulnRows = "";
    // Counter.most_common(50): count desc, ties in first-seen order (Array.sort is stable)
    for (const [v, cnt] of [...allVulns.entries()].sort((a, b) => b[1] - a[1]).slice(0, 50)) {
      const l = v.toLowerCase(), has = (ks) => ks.some((k) => l.includes(k));
      const sev = has(["rce", "bypass", "traversal"]) ? "sv-c" : has(["idor", "ssrf", "xss", "injection"]) ? "sv-h" : has(["misconfig", "disclosure"]) ? "sv-m" : "sv-l";
      const list = vulnTargets.get(v) || [];
      let th = list.slice(0, 50).map((h) => `<li><a href="https://${escH(h)}" target="_blank">${escH(h)}</a></li>`).join("");
      if (list.length > 50) th += `<li style="color:var(--text-muted)">+${list.length - 50} more...</li>`;
      vulnRows += `
        <div class="vuln-card">
            <div class="vuln-header" onclick="this.parentElement.classList.toggle('expanded')">
                <span class="vuln-dot ${sev}"></span>
                <span class="vuln-name">${escH(v)}</span>
                <span class="vuln-count">${cnt} target${plural(cnt)}</span>
                <i class="ph ph-caret-right vuln-arrow"></i>
            </div>
            <div class="vuln-body"><ul>${th}</ul></div>
        </div>`;
    }
    let ipRows = "";
    for (const [ip, d] of ipMap) {
      const ports = [...d.ports].sort().join(", ") || "-";
      let links = d.hosts.slice(0, 5).map((h) => `<a href="https://${escH(h)}" target="_blank">${escH(h)}</a>`).join(" ");
      if (d.hosts.length > 5) links += ` <span class="im">+${d.hosts.length - 5}</span>`;
      ipRows += `<div class="ipr"><div class="ia"><i class="ph ph-network" style="margin-right:6px"></i>${escH(ip)}</div><div class="im2">${d.hosts.length} host${plural(d.hosts.length)} · ${ports}</div><div class="ih">${links}</div></div>\n`;
    }
    const sub = {
      "@@OUT_BASE@@": escH(outBase),
      "@@OUT_HTML_NAME@@": (outBase + ".html").replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/</g, "\\x3c"),
      "@@CAT_BUTTONS@@": catButtons, "@@VULN_ROWS@@": inTemplateLiteral(vulnRows), "@@IP_ROWS@@": inTemplateLiteral(ipRows),
      // The template decodes this with atob()+JSON.parse (no UTF-8 step), which garbles every non-ASCII character.
      // Escaping non-ASCII as \uXXXX first makes the same decode path return the correct text.
      "@@TARGETS_B64@@": toB64(JSON.stringify(targets).replace(/[\u007f-\uffff]/g, (c) => "\\u" + c.charCodeAt(0).toString(16).padStart(4, "0"))),
      // "<" escaped as \u003c: still valid JSON, but notes containing a closing script tag can no longer break the page
      "@@STATE_JSON@@": JSON.stringify(state).replace(/</g, "\\u003c"),
    };
    let html = TPL;
    for (const k of Object.keys(sub)) html = html.split(k).join(sub[k]); // split/join: no "$&" replacement pitfalls
    return { html, outBase };
  }

  /* ---- last-session snapshot (extra safety net for browsers without silent file autosave) ---- */
  const idb = () => new Promise((res, rej) => { const r = indexedDB.open("keendash-launcher", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const idbGet = async () => { try { const db = await idb(); return await new Promise((res) => { const q = db.transaction("kv").objectStore("kv").get("session"); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (e) { return null; } };
  const idbPut = async (v) => { try { const db = await idb(); await new Promise((res) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, "session"); t.oncomplete = res; t.onerror = res; }); } catch (e) { /* non-fatal */ } };
  const idbDel = async () => { try { const db = await idb(); await new Promise((res) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").delete("session"); t.oncomplete = res; t.onerror = res; }); } catch (e) { /* non-fatal */ } };

  // Injected into the written dashboard: mirrors every saveState() into the snapshot above.
  const hook = (name) => `<script>
(function(){var NAME=${JSON.stringify(name).replace(/</g, "\\u003c")},t=null,orig=window.saveState;
function put(){try{var d=buildExportData(),r=indexedDB.open('keendash-launcher',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};
r.onsuccess=function(){r.result.transaction('kv','readwrite').objectStore('kv').put({name:NAME,at:Date.now(),data:d},'session')}}catch(e){console.error('KeenDash snapshot',e)}}
window.saveState=function(){var r=orig.apply(this,arguments);clearTimeout(t);t=setTimeout(put,1000);return r};
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){clearTimeout(t);put()}});})();
<\/script>`;

  function openDashboard(prep, name) {
    const { html, outBase } = generateHtml(prep.targets, prep.ipMap, prep.state, name);
    const i = html.lastIndexOf("</body>");
    const full = i === -1 ? html + hook(name) : html.slice(0, i) + hook(name) + html.slice(i);
    idbPut({ name, at: Date.now(), data: { KeenDash_state: true, version: "9.2", targets: prep.targets, state: prep.state } }).then(() => {
      document.open(); document.write(full); document.close();
    });
  }

  /* ---- launcher UI ---- */
  const files = { main: null, katana: null, nuclei: null };
  let prepared = null;
  const readText = (f) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error || new Error("read failed")); r.readAsText(f); });
  function show(msg, err) { const o = $("kd-out"); o.className = err ? "err" : ""; o.textContent = msg; $("kd-open").hidden = err || !prepared; }
  function setFile(kind, f) { files[kind] = f || null; $("kd-n-" + kind).textContent = f ? f.name + " (" + Math.round(f.size / 1024) + " KB)" : "none"; prepared = null; $("kd-open").hidden = true; }
  async function analyze() {
    prepared = null;
    if (!files.main) return show("Choose an HTTPX file (JSON or JSONL) or a KeenDash state file first.", true);
    try {
      const [m, k, n] = await Promise.all([readText(files.main), files.katana ? readText(files.katana) : "", files.nuclei ? readText(files.nuclei) : ""]);
      if (!m.trim()) return show(files.main.name + " is empty.", true);
      const p = prepare(m, k, n); prepared = { prep: p, name: files.main.name };
      show(p.notes.join("\n") + "\n\nReady. Open the dashboard to start.", false);
    } catch (e) { prepared = null; show(e.message, true); }
  }
  async function init() {
    document.body.innerHTML = `<div id="kd"><h1>KeenDash</h1><p class="sub">Bug bounty prioritization dashboard. Everything runs in this browser tab. Your scan data is never uploaded.</p>
<div id="kd-resume" hidden></div>
<div class="row"><b>1. Scan file</b><span>HTTPX JSON / JSONL, a KeenDash <code>.json</code> state file, or an old dashboard <code>.html</code></span><label class="b">Choose file<input type="file" id="kd-f-main" hidden></label><i id="kd-n-main">none</i></div>
<div class="row"><b>2. Katana (optional)</b><span>Crawl JSONL, like <code>-k</code></span><label class="b">Choose file<input type="file" id="kd-f-katana" hidden></label><i id="kd-n-katana">none</i></div>
<div class="row"><b>3. Nuclei (optional)</b><span>Findings JSONL, like <code>-n</code></span><label class="b">Choose file<input type="file" id="kd-f-nuclei" hidden></label><i id="kd-n-nuclei">none</i></div>
<div class="act"><button id="kd-go" class="p">Analyze</button><button id="kd-open" class="p" hidden>Open dashboard</button></div>
<pre id="kd-out"></pre>
<p class="fine">Autosave works as in the original: inside the dashboard click <b>Link &lt;name&gt;.json</b> once (Chrome/Edge), or use Save to download. This page also keeps a copy of your last session in this browser only, so a refresh does not lose work. To continue a project later, load its saved <code>.json</code> here.</p></div>`;
    for (const k of ["main", "katana", "nuclei"]) $("kd-f-" + k).onchange = (e) => { setFile(k, e.target.files[0]); e.target.value = ""; if (k === "main" && files.main) analyze(); };
    $("kd-go").onclick = analyze;
    $("kd-open").onclick = () => { if (prepared) openDashboard(prepared.prep, prepared.name); };
    document.addEventListener("dragover", (e) => e.preventDefault());
    document.addEventListener("drop", (e) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) { setFile("main", f); analyze(); } });
    const s = await idbGet();
    if (s && s.data && Array.isArray(s.data.targets) && s.data.targets.length) {
      const r = $("kd-resume"); r.hidden = false;
      r.innerHTML = `<b>Last session:</b> ${escH(s.name)}, ${s.data.targets.length} targets, saved ${escH(new Date(s.at).toLocaleString())} <button id="kd-res" class="p">Resume</button> <button id="kd-forget">Forget</button>`;
      $("kd-res").onclick = () => { try { openDashboard(prepare(JSON.stringify(s.data), "", ""), s.name); } catch (e) { show("Could not resume: " + e.message, true); } };
      $("kd-forget").onclick = async () => { await idbDel(); r.hidden = true; };
    }
  }
  init();
})();
</script>
</body>
</html>
