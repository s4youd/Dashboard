<style>
:root{--bg:#22262c;--bg2:#2a2f37;--bg3:#323843;--line:#40474f;--tx:#d3d9e0;--dim:#8d98a5;--acc:#5b8db8;--acc2:#4a7aa3;
--crit:#c2554f;--high:#c98a45;--med:#b8a948;--low:#5b8db8;--info:#7a8591;--ok:#6a9f6a}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:13px/1.45 Verdana,Tahoma,"DejaVu Sans",sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
header{background:linear-gradient(#323843,#2a2f37);border-bottom:1px solid #15181c;display:flex;align-items:center;gap:6px;padding:0 10px;height:38px;flex-wrap:wrap}
header h1{font-size:15px;margin:0 14px 0 0;font-weight:bold;letter-spacing:.3px}
nav a{display:inline-block;padding:11px 10px 10px;color:var(--dim);border-bottom:2px solid transparent;cursor:pointer}
nav a.on{color:var(--tx);border-bottom-color:var(--acc)}
.sp{flex:1}
button,.btn,select,input[type=text],input[type=search],textarea{font:inherit;color:var(--tx)}
button,.btn{background:linear-gradient(#3b424d,#30363f);border:1px solid #14171b;border-radius:3px;padding:3px 10px;cursor:pointer;box-shadow:inset 0 1px 0 #4a525e}
button:hover,.btn:hover{background:linear-gradient(#444c58,#363d47)}
button.pri{background:linear-gradient(#5b8db8,#4a7aa3);box-shadow:inset 0 1px 0 #7aa6cc}
button.danger:hover{background:#7a3a36}
select,input[type=text],input[type=search],textarea{background:#1b1f24;border:1px solid var(--line);border-radius:3px;padding:3px 6px}
textarea{width:100%;resize:vertical;min-height:90px;font-family:Consolas,Menlo,monospace;font-size:12px}
main{padding:10px;max-width:1500px;margin:0 auto}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:3px;margin-bottom:10px}
.panel>h2{margin:0;padding:5px 9px;font-size:12px;background:linear-gradient(#343a44,#2d323b);border-bottom:1px solid var(--line)}
.panel>div{padding:8px 9px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:3px;padding:6px 12px;min-width:100px}
.stat b{display:block;font-size:20px}.stat span{color:var(--dim);font-size:11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}
th{text-align:left;background:#2d323b;padding:4px 8px;border-bottom:1px solid var(--line);font-weight:bold;white-space:nowrap}
th.s{cursor:pointer}td{padding:3px 8px;border-bottom:1px solid #30363e;vertical-align:top}
tbody tr:hover{background:#2f353e}tr.cl{cursor:pointer}
.tag{display:inline-block;padding:0 6px;border-radius:2px;font-size:11px;color:#fff}
.p-critical{background:var(--crit)}.p-high{background:var(--high)}.p-medium{background:var(--med);color:#1b1d12}.p-low{background:var(--low)}.p-info{background:var(--info)}
.chip{display:inline-block;background:#1b1f24;border:1px solid var(--line);border-radius:2px;padding:0 5px;margin:1px 2px 1px 0;font-size:11px;color:var(--dim)}
.bar{display:flex;height:14px;border:1px solid var(--line);background:#1b1f24}.bar i{display:block}
.bar2{height:8px;background:#1b1f24;border:1px solid var(--line);min-width:80px}.bar2 i{display:block;height:100%;background:var(--ok)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.dim{color:var(--dim)}.mono{font-family:Consolas,Menlo,monospace;font-size:12px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:2px 10px}.kv div:nth-child(odd){color:var(--dim)}
.bd td:nth-child(2){text-align:right;width:50px;font-weight:bold}.neg{color:var(--ok)}
.ck{display:block;padding:1px 0}.ck input{margin-right:6px}.ck.done span{color:var(--dim);text-decoration:line-through}
#msg{position:fixed;right:10px;bottom:10px;max-width:520px;z-index:9}
.m{background:#1b1f24;border:1px solid var(--line);border-left:3px solid var(--acc);padding:6px 10px;margin-top:6px;white-space:pre-wrap;cursor:pointer}.m.err{border-left-color:var(--crit)}
.note{background:#2f3a2f;border:1px solid #455a45;padding:5px 9px;margin-bottom:10px;color:#b5c9b5;font-size:12px}
.empty{text-align:center;padding:40px 10px;color:var(--dim)}
</style>
</head>

 *  katana:{host:{urls:[],hits:{label:[urls]}}}, nuclei:{host:[findings]},
 *  targets:[analysed targets incl. score_breakdown], notes:{host:{text,findings,progress,done:{stepText:true}}}}
 * Notes are keyed by HOSTNAME, so they survive re-imports and rescoring.
 */
const E = KeenEngine, PR = ["critical","high","medium","low","info"];
const $ = (s,r)=>(r||document).querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const blank = () => ({raw:[],katana:{},nuclei:{},targets:[],notes:{},settings:{}});
let S = blank();
let ui = {view:"dash", host:null, q:"", prio:"", status:"", tech:"", sort:"score", dir:-1, limit:300};

/* ---------- storage (IndexedDB, autosave) ---------- */
let db=null, saveT=null;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("keendash",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function loadWS(){try{db=await idb();return await new Promise((res,rej)=>{const q=db.transaction("kv").objectStore("kv").get("workspace");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}catch(e){toast("Browser storage unavailable: "+e.message+"\nUse Export to keep your work.",1);return null;}}
function save(){clearTimeout(saveT);$("#saved").textContent="saving...";saveT=setTimeout(()=>{if(!db)return;const t=db.transaction("kv","readwrite");t.objectStore("kv").put(S,"workspace");t.oncomplete=()=>$("#saved").textContent="saved in this browser";t.onerror=()=>toast("Autosave failed: "+t.error,1);},300);}
function toast(t,err){const d=document.createElement("div");d.className="m"+(err?" err":"");d.textContent=t;d.onclick=()=>d.remove();$("#msg").appendChild(d);if(!err)setTimeout(()=>d.remove(),9000);}

/* ---------- analysis glue ---------- */
// serialise/revive Katana sets so they live in JSON/IndexedDB
const katOut = m => Object.fromEntries(Object.entries(m).map(([h,v])=>[h,{urls:[...v.urls],hits:Object.fromEntries(Object.entries(v.hits).map(([l,u])=>[l,[...u]]))}]));
const katIn = m => Object.fromEntries(Object.entries(m).map(([h,v])=>[h,{urls:new Set(v.urls),hits:Object.fromEntries(Object.entries(v.hits).map(([l,u])=>[l,new Set(u)]))}]));
function analyse(){ // deterministic rebuild from raw records + enrichment
  const t = E.buildTargets(S.raw);
  E.enrichWithRecon(t, katIn(S.katana), S.nuclei);
  t.sort((a,b)=>b.score-a.score);
  S.targets = t;
}
const T = h => S.targets.find(t=>t.host===h);
const N = h => S.notes[h] || (S.notes[h]={text:"",findings:"",progress:"not started",done:{}});
const hasNote = n => n && (n.text.trim()||n.findings.trim()||n.progress!=="not started"||Object.keys(n.done).length);
function progressAll(){let tot=0,done=0;for(const t of S.targets){tot+=t.steps.length;const d=(S.notes[t.host]||{}).done||{};done+=t.steps.filter(s=>d[s]).length;}return [done,tot];}

/* ---------- import ---------- */
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsText(f);});}
function summary(name,rep){let s=`${name}: ${rep.imported} of ${rep.total} records imported`;if(rep.skipped.length){s+=`, ${rep.skipped.length} skipped`;s+="\n"+rep.skipped.slice(0,8).map(k=>`  - ${k.where}: ${k.reason}`).join("\n");if(rep.skipped.length>8)s+=`\n  ... and ${rep.skipped.length-8} more`;}return s;}
async function importFiles(files,kind){
  for(const f of files){
    let text; try{text=await readFile(f);}catch(e){toast(`${f.name}: could not read file (${e.message})`,1);continue;}
    if(!text.trim()){toast(`${f.name}: file is empty`,1);continue;}
    if(kind==="project"){importProject(text,f.name);continue;}
    if(kind==="httpx"){
      const {entries,report}=E.parseRecords(text);
      if(report.format==="keendash-project"){toast(`${f.name} is a KeenDash project file. Use "Import project" instead.`,1);continue;}
      if(!entries.length){toast(summary(f.name,report)+"\nNo usable HTTPX records found.",1);continue;}
      // Repeat-import rule: records are appended, then targets are rebuilt per host (same rule as dash.py:
      // most words wins). Notes are keyed by host and are never touched.
      const before=S.targets.length, bset=new Set(S.targets.map(t=>t.host));
      S.raw=S.raw.concat(entries);analyse();
      const fresh=S.targets.filter(t=>!bset.has(t.host)).length;
      toast(summary(f.name,report)+`\nTargets: ${before} -> ${S.targets.length} (${fresh} new, existing notes kept)`,report.skipped.length>0&&!entries.length);
    } else {
      const p=kind==="katana"?E.parseKatana(text):E.parseNuclei(text);
      const keys=Object.keys(p.map);
      if(!keys.length){toast(summary(f.name,p.report)+`\nNo ${kind} records with a usable host.`,1);continue;}
      if(kind==="katana"){const cur=katIn(S.katana);for(const [h,v] of Object.entries(p.map)){const c=cur[h]=cur[h]||{urls:new Set(),hits:{}};v.urls.forEach(u=>c.urls.add(u));for(const [l,us] of Object.entries(v.hits)){const s=c.hits[l]=c.hits[l]||new Set();us.forEach(u=>s.add(u));}}S.katana=katOut(cur);}
      else{for(const [h,v] of Object.entries(p.map))S.nuclei[h]=(S.nuclei[h]||[]).concat(v);}
      analyse();
      const match=keys.filter(h=>T(h)).length;
      toast(summary(f.name,p.report)+`\n${keys.length} hosts in file, ${match} match imported targets.`+(match<keys.length?"\nUnmatched hosts are kept but only apply once a matching HTTPX target exists.":""));
    }
  }
  save();render();
}
function importProject(text,name){
  let d;try{d=JSON.parse(text);}catch(e){return toast(`${name}: not valid JSON (${e.message}). Workspace unchanged.`,1);}
  const bad=[];
  if(!d||d.format!=="keendash-project")bad.push('missing format "keendash-project"');
  else{
    if(typeof d.version!=="number"||d.version>1)bad.push("unsupported version "+d.version);
    if(!Array.isArray(d.raw))bad.push("raw must be an array");
    if(!d.notes||typeof d.notes!=="object"||Array.isArray(d.notes))bad.push("notes must be an object");
    if(d.katana&&typeof d.katana!=="object")bad.push("katana must be an object");
    if(d.nuclei&&typeof d.nuclei!=="object")bad.push("nuclei must be an object");
  }
  if(bad.length)return toast(`${name}: invalid project file\n  - ${bad.join("\n  - ")}\nWorkspace unchanged.`,1);
  if(S.raw.length||Object.keys(S.notes).length){if(!confirm(`Replace the current workspace (${S.targets.length} targets, ${Object.keys(S.notes).filter(h=>hasNote(S.notes[h])).length} notes) with ${name}?\nExport the current one first if you need it.`))return toast("Project import cancelled. Workspace unchanged.");}
  const ns={};for(const [h,n] of Object.entries(d.notes))ns[h]={text:String(n.text||""),findings:String(n.findings||""),progress:String(n.progress||"not started"),done:(n.done&&typeof n.done==="object")?n.done:{}};
  S={raw:d.raw,katana:d.katana||{},nuclei:d.nuclei||{},targets:[],notes:ns,settings:d.settings||{}};
  analyse();ui.host=null;toast(`Project restored: ${S.targets.length} targets, ${Object.values(ns).filter(hasNote).length} notes.`);
}
function exportProject(){
  if(!S.raw.length&&!Object.keys(S.notes).length)return toast("Nothing to export yet. Import HTTPX data first.",1);
  const d={format:"keendash-project",version:1,exported:new Date().toISOString(),settings:S.settings,raw:S.raw,katana:S.katana,nuclei:S.nuclei,targets:S.targets,notes:S.notes};
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:"application/json"}));
  a.download="keendash-project-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();toast(`Exported ${S.targets.length} targets.`);
}

/* ---------- views ---------- */
const ptag = p => `<span class="tag p-${p}">${p}</span>`;
const empty = () => `<div class="empty">No targets yet.<br><br><button class="pri" data-act="goto" data-v="data">Import HTTPX results</button></div>`;
function vDash(){
  if(!S.targets.length)return empty();
  const c=Object.fromEntries(PR.map(p=>[p,0]));S.targets.forEach(t=>c[t.priority]++);
  const ips=new Set();S.targets.forEach(t=>t.ips.forEach(i=>i&&ips.add(i)));
  const [d,tot]=progressAll(), notes=Object.values(S.notes).filter(hasNote).length, col={critical:"crit",high:"high",medium:"med",low:"low",info:"info"};
  const top=S.targets.slice(0,12).map(t=>`<tr class="cl" data-act="open" data-h="${esc(t.host)}"><td>${ptag(t.priority)}</td><td>${t.score}</td><td>${esc(t.host)}</td><td>${t.status}</td></tr>`).join("");
  return `<div class="stats"><div class="stat"><b>${S.targets.length}</b><span>targets</span></div>${PR.map(p=>`<div class="stat"><b style="color:var(--${col[p]})">${c[p]}</b><span>${p}</span></div>`).join("")}
  <div class="stat"><b>${ips.size}</b><span>unique IPs</span></div><div class="stat"><b>${notes}</b><span>targets with notes</span></div>
  <div class="stat"><b>${tot?Math.round(d/tot*100):0}%</b><span>checklist (${d}/${tot})</span></div></div>
  <div class="grid"><div class="panel"><h2>Priority distribution</h2><div><div class="bar">${PR.map(p=>c[p]?`<i style="width:${c[p]/S.targets.length*100}%;background:var(--${col[p]})" title="${p}: ${c[p]}"></i>`:"").join("")}</div>
  <p class="dim" style="margin:6px 0 0">${PR.map(p=>`${p} ${c[p]}`).join(" / ")}</p></div></div>
  <div class="panel"><h2>Highest priority</h2><div style="padding:0"><table><tbody>${top}</tbody></table></div></div></div>`;
}
function filtered(){
  const q=ui.q.toLowerCase();let r=S.targets.filter(t=>(!q||t.host.toLowerCase().includes(q))&&(!ui.prio||t.priority===ui.prio)&&(!ui.status||String(t.status)===ui.status)&&(!ui.tech||t.tech.some(x=>String(x)===ui.tech)));
  const k={score:t=>t.score,host:t=>t.host,status:t=>t.status}[ui.sort];
  return r.sort((a,b)=>{const x=k(a),y=k(b);return (x<y?-1:x>y?1:0)*ui.dir;});
}
function vTargets(){
  if(!S.targets.length)return empty();
  const st=[...new Set(S.targets.map(t=>t.status))].sort((a,b)=>a-b), te=[...new Set(S.targets.flatMap(t=>t.tech.map(String)))].sort((a,b)=>a.toLowerCase()<b.toLowerCase()?-1:1);
  const rows=filtered(), shown=rows.slice(0,ui.limit), arr=c=>ui.sort===c?(ui.dir<0?" v":" ^"):"";
  return `<div class="tools"><input type="search" id="q" placeholder="Search hostname" value="${esc(ui.q)}" size="24">
  <select data-f="prio"><option value="">All priorities</option>${PR.map(p=>`<option ${ui.prio===p?"selected":""}>${p}</option>`).join("")}</select>
  <select data-f="status"><option value="">All statuses</option>${st.map(s=>`<option ${ui.status===String(s)?"selected":""}>${s}</option>`).join("")}</select>
  <select data-f="tech"><option value="">All technologies</option>${te.map(s=>`<option ${ui.tech===s?"selected":""}>${esc(s)}</option>`).join("")}</select>
  <span class="dim">${rows.length} of ${S.targets.length}</span></div>
  <div class="panel"><div style="padding:0"><table><thead><tr><th>Priority</th><th class="s" data-sort="score">Score${arr("score")}</th><th class="s" data-sort="host">Hostname${arr("host")}</th><th class="s" data-sort="status">Status${arr("status")}</th><th>Technology</th><th>Notes</th></tr></thead>
  <tbody>${shown.map(t=>`<tr class="cl" data-act="open" data-h="${esc(t.host)}"><td>${ptag(t.priority)}</td><td>${t.score}</td><td>${esc(t.host)}</td><td>${t.status}</td><td>${t.tech.slice(0,4).map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</td><td>${hasNote(S.notes[t.host])?"yes":""}</td></tr>`).join("")||`<tr><td colspan="6" class="empty">No targets match these filters.</td></tr>`}</tbody></table></div></div>
  ${rows.length>shown.length?`<button data-act="more">Show ${Math.min(500,rows.length-shown.length)} more</button>`:""}`;
}
function vDetail(){
  const t=T(ui.host);if(!t){ui.host=null;return vTargets();}
  const n=N(t.host), bd=t.score_breakdown, names={status:"HTTP status",tech:"Technology",content:"Content",naming:"Hostname",title:"Page title",infra:"Infrastructure",recon:"Recon (Katana / Nuclei)"};
  const groups={};t.steps.forEach(s=>{const [k,l,q]=s.split("|");(groups[k]=groups[k]||{l,q:[]}).q.push([s,q]);});
  const done=t.steps.filter(s=>n.done[s]).length;
  return `<div class="tools"><button data-act="back">&lt; Targets</button> <b style="font-size:15px">${esc(t.host)}</b> ${ptag(t.priority)} <span>score ${t.score}</span></div>
  <div class="grid"><div>
  <div class="panel"><h2>Overview</h2><div class="kv"><div>URL</div><div>${esc(t.url)||"-"}</div><div>Status</div><div>${t.status}</div><div>Title</div><div>${esc(t.title)||"-"}</div>
  <div>Technology</div><div>${t.tech.map(x=>`<span class="chip">${esc(x)}</span>`).join("")||"-"}</div><div>IP addresses</div><div class="mono">${t.ips.map(esc).join(", ")||esc(t.ip)||"-"}</div>
  <div>Port</div><div>${esc(t.port)||"-"}</div><div>Words / size</div><div>${t.words} / ${t.cl}</div>${t.location?`<div>Location</div><div>${esc(t.location)}</div>`:""}
  <div>Categories</div><div>${t.cats.map(x=>`<span class="chip">${x}</span>`).join("")}</div><div>Summary</div><div>${esc(t.desc)}</div></div></div>
  <div class="panel"><h2>Score breakdown</h2><div style="padding:0"><table class="bd">${Object.keys(bd).filter(k=>bd[k].length).map(k=>`<tr><th colspan="2">${names[k]}</th></tr>`+bd[k].map(([l,p,r])=>`<tr><td><b>${esc(l)}</b><br><span class="dim">${esc(r)}</span></td><td class="${p<0?"neg":""}">${p>0?"+":""}${p}</td></tr>`).join("")).join("")}</table></div></div>
  <div class="panel"><h2>Vulnerability suggestions</h2><div>${t.vulns.map(v=>`<span class="chip">${esc(v)}</span>`).join("")||'<span class="dim">None</span>'}</div></div>
  ${t.katana?`<div class="panel"><h2>Katana (${t.katana.count} URLs)</h2><div>${t.katana.interesting.map(i=>`<b>${esc(i.label)}</b><div class="mono dim">${i.urls.map(esc).join("<br>")}</div>`).join("")||'<span class="dim">No sensitive paths</span>'}</div></div>`:""}
  ${t.nuclei?`<div class="panel"><h2>Nuclei (${t.nuclei.length} findings)</h2><div style="padding:0"><table><tbody>${t.nuclei.map(f=>`<tr><td>${esc(f.severity)}</td><td>${esc(f.name)}</td><td class="mono dim">${esc(f.matched_at)}</td></tr>`).join("")}</tbody></table></div></div>`:""}
  </div><div>
  <div class="panel"><h2>Notes</h2><div><div class="tools"><label>Testing progress <select data-n="progress">${["not started","in progress","done","blocked"].map(p=>`<option ${n.progress===p?"selected":""}>${p}</option>`).join("")}</select></label></div>
  <p class="dim" style="margin:4px 0">Observations</p><textarea data-n="text">${esc(n.text)}</textarea><p class="dim" style="margin:8px 0 4px">Findings / potential issues</p><textarea data-n="findings">${esc(n.findings)}</textarea></div></div>
  <div class="panel"><h2>Checklist <span class="dim" id="cnt">(${done}/${t.steps.length})</span></h2><div>${Object.values(groups).map(g=>`<b>${esc(g.l)}</b>${g.q.map(([s,q])=>`<label class="ck ${n.done[s]?"done":""}"><input type="checkbox" data-s="${esc(s)}" ${n.done[s]?"checked":""}><span>${esc(q)}</span></label>`).join("")}<div style="height:6px"></div>`).join("")}</div></div>
  </div></div>`;
}
function vIps(){
  const m=E.buildIpMap(S.targets);if(!m.length)return `<div class="empty">No IP addresses in the imported data.</div>`;
  return `<div class="panel"><h2>${m.length} unique IPs (only data present in the HTTPX results)</h2><div style="padding:0"><table><thead><tr><th>IP</th><th>Hosts</th><th>Ports</th><th>Technology</th></tr></thead><tbody>${m.map(([ip,v])=>`<tr><td class="mono">${esc(ip)}</td><td>${v.hosts.map(h=>`<a data-act="open" data-h="${esc(h)}">${esc(h)}</a>`).join("<br>")}</td><td>${[...v.ports].map(esc).join(", ")}</td><td>${[...v.techs].map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</td></tr>`).join("")}</tbody></table></div></div>`;
}
function vNotes(){
  const hs=Object.keys(S.notes).filter(h=>hasNote(S.notes[h]));if(!hs.length)return `<div class="empty">No notes yet. Open a target and write something, or tick a checklist item.</div>`;
  return `<div class="panel"><h2>${hs.length} targets with notes</h2><div style="padding:0"><table><thead><tr><th>Host</th><th>Progress</th><th>Checklist</th><th>Notes</th></tr></thead><tbody>${hs.map(h=>{const n=S.notes[h],t=T(h),c=Object.values(n.done).filter(Boolean).length;return `<tr class="cl" ${t?`data-act="open" data-h="${esc(h)}"`:""}><td>${esc(h)}${t?"":' <span class="dim">(not in current targets)</span>'}</td><td>${esc(n.progress)}</td><td>${c}${t?"/"+t.steps.length:""}</td><td class="dim">${esc((n.findings||n.text).slice(0,110))}</td></tr>`;}).join("")}</tbody></table></div></div>`;
}
function vData(){
  const [d,tot]=progressAll();
  return `<div class="note">Everything is stored in this browser only (IndexedDB) and is never uploaded. Browser storage is local to this browser and device. Use Export project regularly as your backup, and to move work between machines.</div>
  <div class="grid"><div class="panel"><h2>Import</h2><div><p>HTTPX results (JSON array, JSON object or JSONL). Repeated imports merge by hostname; notes are kept.</p><button class="pri" data-imp="httpx">Import HTTPX file(s)</button>
  <p>Optional enrichment (raises scores like dash.py -k / -n):</p><button data-imp="katana">Import Katana JSONL</button> <button data-imp="nuclei">Import Nuclei JSONL</button>
  <p>Restore a saved project (replaces the workspace after confirmation):</p><button data-imp="project">Import project JSON</button></div></div>
  <div class="panel"><h2>Export / reset</h2><div><p>Workspace: ${S.raw.length} raw records, ${S.targets.length} targets, ${Object.values(S.notes).filter(hasNote).length} notes, ${d}/${tot} checklist items.</p>
  <button class="pri" data-act="export">Export project JSON</button> <button class="danger" data-act="reset">Clear workspace</button></div></div></div>`;
}
const V={dash:vDash,targets:()=>ui.host?vDetail():vTargets(),ips:vIps,notes:vNotes,data:vData};
function render(){
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===ui.view));
  const y=scrollY;$("#main").innerHTML=V[ui.view]();const q=$("#q");if(q&&document.activeElement===document.body&&ui._focusQ){q.focus();q.setSelectionRange(q.value.length,q.value.length);}scrollTo(0,y);
}

/* ---------- events ---------- */
let pick="httpx";
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-v],[data-act],[data-sort],[data-imp]");if(!el)return;
  if(el.dataset.imp){pick=el.dataset.imp;const f=$("#file");f.accept=pick==="project"?".json":".json,.jsonl,.txt";f.multiple=pick!=="project";f.click();return;}
  if(el.dataset.sort){ui.dir=ui.sort===el.dataset.sort?-ui.dir:(el.dataset.sort==="score"?-1:1);ui.sort=el.dataset.sort;return render();}
  const a=el.dataset.act;
  if(el.dataset.v&&!a){ui.view=el.dataset.v;if(ui.view!=="targets")ui.host=null;return render();}
  if(a==="goto"){ui.view=el.dataset.v;return render();}
  if(a==="open"){ui.view="targets";ui.host=el.dataset.h;scrollTo(0,0);return render();}
  if(a==="back"){ui.host=null;return render();}
  if(a==="more"){ui.limit+=500;return render();}
  if(a==="export")return exportProject();
  if(a==="reset"&&confirm("Delete all targets, notes and checklists from this browser? Export first if you want a backup.")){S=blank();ui.host=null;save();render();toast("Workspace cleared.");}
});
$("#file").addEventListener("change",e=>{const fs=[...e.target.files];e.target.value="";if(fs.length)importFiles(fs,pick);});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){ui.q=t.value;ui.limit=300;ui._focusQ=1;const y=scrollY;$("#main").innerHTML=V[ui.view]();const q=$("#q");q.focus();q.setSelectionRange(q.value.length,q.value.length);scrollTo(0,y);}
  else if(t.dataset.n&&ui.host){N(ui.host)[t.dataset.n]=t.value;save();}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.f){ui[t.dataset.f]=t.value;ui.limit=300;render();}
  else if(t.dataset.s&&ui.host){const n=N(ui.host);if(t.checked)n.done[t.dataset.s]=true;else delete n.done[t.dataset.s];t.closest("label").classList.toggle("done",t.checked);const tg=T(ui.host);$("#cnt").textContent=`(${tg.steps.filter(s=>n.done[s]).length}/${tg.steps.length})`;save();}
});
window.addEventListener("error",e=>toast("Unexpected error: "+e.message,1));
(async()=>{const w=await loadWS();if(w&&Array.isArray(w.raw)){S=Object.assign(blank(),w);analyse();$("#saved").textContent="restored from this browser";}render();})();
</script>
</body>
</html>
